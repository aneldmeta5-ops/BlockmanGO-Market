<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMG & Discord Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Arabic:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter','Noto Sans Devanagari','Noto Sans Arabic',sans-serif;background:#08090d;color:#f3f4f6}
  .card{background:#11131c;border:1px solid #1e2333}
  .card:hover{border-color:#a855f7}
  .scroll-none::-webkit-scrollbar{display:none}
  :focus-visible{outline:2px solid #06b6d4;outline-offset:2px}
  select option{background:#11131c}
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="sticky top-0 z-40 bg-[#08090d]/90 backdrop-blur border-b border-[#1e2333]">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
    <a href="#" onclick="setCat('All')" class="font-extrabold text-lg tracking-wide">BMG <span class="text-purple-400">&</span> Discord Store</a>
    <div class="flex items-center gap-2">
      <select id="lang" onchange="setLang(this.value)" class="card rounded-xl px-3 py-2 text-sm bg-transparent" aria-label="Language">
        <option value="en">English</option><option value="hi">हिन्दी</option><option value="ar">العربية</option>
      </select>
      <button onclick="toggleCart()" class="card rounded-xl px-4 py-2 text-sm font-semibold" aria-label="Cart">
        <span data-i18n="cart"></span> <span id="cart-count" class="mx-1 bg-purple-500 text-xs rounded-full px-2 py-0.5">0</span>
      </button>
    </div>
  </div>
</header>

<section class="max-w-6xl mx-auto px-4 pt-8 w-full">
  <h1 class="text-3xl sm:text-5xl font-extrabold leading-tight" data-i18n="hero_t"></h1>
  <p class="mt-3 text-gray-400 max-w-xl" data-i18n="hero_p"></p>
</section>

<main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow">
  <div class="flex flex-col md:flex-row gap-3 md:items-center justify-between mb-6">
    <div id="filters" class="flex gap-2 overflow-x-auto scroll-none"></div>
    <input id="search" oninput="render()" data-ph="search" class="card rounded-xl px-4 py-2 text-sm w-full md:w-72 bg-transparent">
  </div>
  <p id="count" class="text-sm text-gray-400 mb-4"></p>
  <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  <p id="empty" class="hidden text-center text-gray-400 py-16" data-i18n="empty"></p>
</main>

<footer class="border-t border-[#1e2333] py-6 text-center text-xs text-gray-500" data-i18n="footer"></footer>

<div id="zoom" onclick="this.classList.add('hidden')" class="hidden fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4"><img id="zoom-img" class="max-h-[85vh] max-w-full rounded-2xl"></div>
<div id="overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/70 z-50 hidden"></div>
<aside id="drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-[#0d0f16] border-l border-[#1e2333] z-50 translate-x-full transition-transform flex flex-col">
  <div class="p-5 border-b border-[#1e2333] flex justify-between items-center">
    <h2 class="font-bold" data-i18n="cart_t"></h2>
    <button onclick="toggleCart()" class="text-2xl leading-none" aria-label="Close">×</button>
  </div>
  <div class="flex-grow overflow-y-auto p-5 space-y-4">
    <div id="cart-items" class="space-y-3"></div>

    <div>
      <button onclick="togglePay()" class="card w-full rounded-xl px-4 py-3 text-sm font-semibold flex justify-between items-center">
        <span><span data-i18n="pay_t"></span>: <span id="pay-cur" class="text-cyan-400"></span></span>
        <span id="pay-arrow" class="transition-transform">▾</span>
      </button>
      <div id="pay-list" class="hidden mt-2 space-y-2"></div>
    </div>

    <input id="buyer" data-ph="discord_ph" class="card rounded-xl px-4 py-2 text-sm w-full bg-transparent">

    <div class="rounded-2xl border border-purple-500/40 bg-purple-500/10 p-4 space-y-3 text-sm text-gray-200">
      <h3 class="font-bold text-purple-300" data-i18n="how_t"></h3>
      <div class="flex gap-3"><span class="font-extrabold text-cyan-400">1</span><p data-i18n="s1"></p></div>
      <div class="flex gap-3"><span class="font-extrabold text-cyan-400">2</span><p data-i18n="s2"></p></div>
      <div class="flex gap-3"><span class="font-extrabold text-cyan-400">3</span><p data-i18n="s3"></p></div>
    </div>
  </div>
  <div class="p-5 border-t border-[#1e2333] space-y-3">
    <div class="flex justify-between text-sm"><span class="text-gray-400" data-i18n="total"></span><span id="total" class="font-bold text-cyan-400"></span></div>
    <button onclick="checkout()" class="w-full py-3 rounded-xl font-extrabold text-black bg-gradient-to-r from-purple-500 to-cyan-400" data-i18n="send"></button>
  </div>
</aside>

const METHODS=[["gcubes","p_gc"],["usd","p_usd"],["skyblock","p_sky"]];

let lang="en",cat="All",pay="usd",cart=[];
const $=id=>document.getElementById(id);
const t=(k,v={})=>(I[lang][k]??I.en[k]).replace(/\{(\w+)\}/g,(_,x)=>v[x]);
const pt=(id,i)=>(PT[id][lang]||PT[id].en)[i];
const nf=n=>Math.round(n).toLocaleString("en");
function price(usd,m=pay){
  const v=usd*RATES[m];
  return m==="usd"?"$"+(Number.isInteger(v)?v:v.toFixed(2)):nf(v)+" "+(m==="gcubes"?"Gcubes":"Skyblock Coins");
}
function setLang(l){
  lang=l;try{localStorage.setItem("lang",l)}catch(e){}
  document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
  $("lang").value=l;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
  render();drawCart();
}
function setCat(c){cat=c;render()}
function render(){
  $("filters").innerHTML=CATEGORIES.map(c=>`<button onclick="setCat('${c}')" class="px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap ${c===cat?'bg-purple-500 text-white':'card text-gray-300'}">${t("c_"+c)}</button>`).join("");
  const q=$("search").value.toLowerCase();
  const list=PRODUCTS.filter(p=>(cat==="All"||p.cat===cat)&&(pt(p.id,0)+pt(p.id,1)).toLowerCase().includes(q));
  $("count").textContent=list.length===1?t("n1"):t("nn",{n:list.length});
  $("empty").classList.toggle("hidden",list.length>0);
  $("grid").innerHTML=list.map(p=>`
    <div class="card rounded-2xl p-5 flex flex-col transition">
      <img src="${p.img}" alt="${pt(p.id,0)}" loading="lazy" onclick="zoom('${p.img}')" class="w-full h-44 object-contain bg-[#0b0c12] rounded-xl mb-3 cursor-zoom-in">
      <div class="text-xs text-gray-500">${t("c_"+p.cat)}</div>
      <h3 class="font-bold mt-1">${pt(p.id,0)}</h3>
      <p class="text-sm text-gray-400 mt-1 flex-grow">${pt(p.id,1)}</p>
      <p class="text-xs mt-2 ${p.stock<1?'text-red-400':p.stock===1?'text-amber-400':'text-green-400'}">${p.stock<1?t("sold"):p.stock===1?t("only1"):t("stock",{n:p.stock})}</p>
      <div class="flex items-center justify-between mt-4 gap-2">
        <span class="font-bold text-cyan-400">${price(p.usd)}</span>
        <button onclick="add(${p.id})" ${p.stock<1?'disabled':''} class="px-4 py-2 rounded-xl text-sm font-bold ${p.stock<1?'bg-gray-700 text-gray-400 cursor-not-allowed':'bg-purple-500 hover:bg-purple-400'}">${p.stock<1?t("sold"):t("add")}</button>
      </div>
    </div>`).join("");
}
function zoom(src){$("zoom-img").src=src;$("zoom").classList.remove("hidden")}
function add(id){
  const it=cart.find(i=>i.id===id),x=PRODUCTS.find(y=>y.id===id);
  if(it&&it.qty>=x.stock){alert(t("a_stock",{n:x.stock}));toggleCart(true);return}
  it?it.qty++:cart.push({id,qty:1});
  drawCart();toggleCart(true);
}
function change(id,d){
  const it=cart.find(i=>i.id===id),x=PRODUCTS.find(y=>y.id===id);
  if(d>0&&it.qty>=x.stock){alert(t("a_stock",{n:x.stock}));return}
  it.qty+=d;if(it.qty<1)cart=cart.filter(i=>i.id!==id);
  drawCart();
}
function totalUsd(){return cart.reduce((s,i)=>s+PRODUCTS.find(y=>y.id===i.id).usd*i.qty,0)}
function togglePay(){
  const l=$("pay-list"),open=l.classList.toggle("hidden")===false;
  $("pay-arrow").style.transform=open?"rotate(180deg)":"";
}
function setPay(m){pay=m;$("pay-list").classList.add("hidden");$("pay-arrow").style.transform="";render();drawCart()}
function drawCart(){
  $("cart-count").textContent=cart.reduce((n,i)=>n+i.qty,0);
  $("cart-items").innerHTML=cart.length?cart.map(i=>{
    const x=PRODUCTS.find(y=>y.id===i.id);
    return `<div class="card rounded-xl p-3 flex items-center justify-between gap-3">
      <div><div class="font-semibold text-sm">${pt(x.id,0)}</div><div class="text-xs text-gray-400">${price(x.usd)}</div></div>
      <div class="flex items-center gap-2">
        <button onclick="change(${x.id},-1)" class="w-7 h-7 card rounded-lg">−</button>
        <span class="text-sm w-4 text-center">${i.qty}</span>
        <button onclick="change(${x.id},1)" class="w-7 h-7 card rounded-lg">+</button>
      </div></div>`}).join(""):`<p class="text-gray-400 text-sm">${t("cart_empty")}</p>`;
  $("pay-cur").textContent=t(METHODS.find(m=>m[0]===pay)[1]);
  $("pay-list").innerHTML=METHODS.map(([m,k],n)=>`<button onclick="setPay('${m}')" class="w-full text-start rounded-xl px-4 py-3 text-sm font-semibold ${m===pay?'bg-purple-500 text-white':'card text-gray-200'}">${n+1}. ${t(k)}</button>`).join("");
  $("total").textContent=price(totalUsd());
}
function toggleCart(open){
  const d=$("drawer"),o=$("overlay");
  const show=open===true?true:d.classList.contains("translate-x-full");
  d.classList.toggle("translate-x-full",!show);o.classList.toggle("hidden",!show);
}
async function checkout(){
  if(!cart.length){alert(t("a_empty"));return}
  const who=$("buyer").value.trim();
  if(!who){alert(t("a_name"));$("buyer").focus();return}
  const m=METHODS.find(x=>x[0]===pay)[1];
  const text=`New order from ${who}\n`+cart.map(i=>{const x=PRODUCTS.find(y=>y.id===i.id);return `- ${i.qty} x ${PT[x.id].en[0]} (${price(x.usd)})`}).join("\n")+`\nPayment method: ${I.en[m]}\nTotal: ${price(totalUsd())}`;
  try{await navigator.clipboard.writeText(text)}catch(e){prompt("Copy your order:",text)}
  alert(t("a_done"));
  window.open(TICKET_LINK,"_blank");
}
try{const s=localStorage.getItem("lang");if(s&&I[s])lang=s}catch(e){}
setLang(lang);
</script>
